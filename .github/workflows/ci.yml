# GitHub Actions CI
#
# 为什么要在简历项目里放 CI？
# - 面试官点进仓库看到绿色的 ✅，第一印象就是"这人工程习惯不错"
# - 每次 push 自动编译 + 跑单测，能证明代码真的能构建通过（不是复制粘贴的）
# - .github/workflows 本身就是"会 Git + 会 CI/CD"的证据

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------- Java ----------
  java-build:
    name: Java 17 编译 & 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven 编译
        run: mvn -B -q clean compile -DskipTests

      - name: 运行单元测试
        run: mvn -B test

  # ---------- Python ----------
  python-build:
    name: Python 语法检查 & 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./novamall-analytics
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法编译检查
        run: python -m compileall app

      - name: 运行单元测试
        run: python -m pytest app/tests -v

  # ---------- Go ----------
  go-build:
    name: Go 编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 编译压测工具（零依赖）
        working-directory: ./novamall-go/bench
        run: go build ./...

      - name: 编译短链服务
        working-directory: ./novamall-go/shortlink
        run: |
          go mod tidy
          go build ./...
