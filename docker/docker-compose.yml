# ============================================================
# NovaMall 本地依赖一键启动
# 用法：docker compose -f docker/docker-compose.yml up -d
# 停止：docker compose -f docker/docker-compose.yml down
# 清数据：docker compose -f docker/docker-compose.yml down -v
# ============================================================
services:

  mysql:
    image: mysql:8.0.36
    container_name: novamall-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novamall
      TZ: Asia/Shanghai
    command:
      # 8.0 默认用 caching_sha2_password，部分老客户端连不上，这里退回 mysql_native_password
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本
      - ../sql/novamall.sql:/docker-entrypoint-initdb.d/novamall.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: novamall-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: novamall-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理后台 http://localhost:15672  guest/guest
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  # Nacos 单机模式（注册中心 + 配置中心）
  # 内存不足 4G 的机器可以先注释掉这一段，改用「本地直连模式」，见 README
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: novamall-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      NACOS_AUTH_TOKEN: bm92YW1hbGwtc2VjcmV0LWtleS1mb3ItZGVtby0xMjM0NTY3ODkw
      NACOS_AUTH_IDENTITY_KEY: novamall
      NACOS_AUTH_IDENTITY_VALUE: novamall
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    volumes:
      - nacos-data:/home/nacos/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  nacos-data:
